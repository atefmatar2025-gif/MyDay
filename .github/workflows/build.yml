name: Build MyDay APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # (اختياري) مفتاح توقيع خاص لنسخة Release من أسرار المستودع
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYDAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MYDAY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      - name: Build Debug & Release APK + AAB
        env:
          MYDAY_KEYSTORE_PASSWORD: ${{ secrets.MYDAY_KEYSTORE_PASSWORD }}
          MYDAY_KEY_ALIAS: ${{ secrets.MYDAY_KEY_ALIAS }}
          MYDAY_KEY_PASSWORD: ${{ secrets.MYDAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease 2>&1 | tee -a build.log

      # عند الفشل: إظهار أخطاء التجميع والاختبارات كتنبيهات مقروءة في صفحة التشغيل
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " build.log | head -40 | while IFS= read -r line; do
            echo "::error title=Compile::${line:0:900}"
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.get('message') or fail.text or '').replace('\n', ' ')[:600]
                      print(f"::error title=Test {tc.get('name')}::{msg}")
                      n += 1
                      if n > 40: raise SystemExit
          PY

      - name: Collect outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/MyDay-debug.apk
          cp app/build/outputs/apk/release/*.apk out/MyDay-release.apk
          cp app/build/outputs/bundle/release/*.aab out/MyDay-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MyDay-builds
          path: out/
          if-no-files-found: error

      # رابط تنزيل مباشر من صفحة Releases (أسهل من الهاتف)
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: يومي – بناء رقم ${{ github.run_number }}
          body: |
            ثبّت **MyDay-release.apk** على هاتفك (الموصى به).
            MyDay-debug.apk نسخة للتطوير، وMyDay-release.aab للرفع على Google Play.
          make_latest: true
          files: |
            out/MyDay-release.apk
            out/MyDay-debug.apk
            out/MyDay-release.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
